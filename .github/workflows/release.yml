name: Release

# Publishes to npm when a version tag is pushed:
#
#   npm version patch        # bumps package.json and tags vX.Y.Z
#   git push origin main --follow-tags
#
# A pre-release version (1.1.0-beta.1) goes out under the `next` dist-tag, so
# `npm install @proctorlink/sdk` always resolves to the stable release.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check everything, publish nothing'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      # Required for npm provenance: the OIDC token is what links the tarball
      # to this workflow run.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Resolve version
        id: v
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Git tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$tagged" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ${{ steps.v.outputs.version }}"
            exit 1
          fi

      - name: Version is not already on npm
        run: |
          if npm view "@proctorlink/sdk@${{ steps.v.outputs.version }}" version >/dev/null 2>&1; then
            echo "::error::@proctorlink/sdk@${{ steps.v.outputs.version }} is already published"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Types
        run: npm run types

      # The loader asks for an enclave pinned to its own version, so the
      # enclave has to be live BEFORE the package is installable. Otherwise the
      # first customer to upgrade loads a 404 and no session starts.
      - name: Enclave is live for this version
        run: |
          url="https://enclave.proctorlink.com/${{ steps.v.outputs.version }}/enclave.html"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::$url returned $code — deploy dist/enclave to that path first"
            exit 1
          fi

      - name: Pack
        run: npm pack --dry-run

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish --provenance --access public --tag ${{ steps.v.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### @proctorlink/sdk ${{ steps.v.outputs.version }}"
            echo
            echo "- dist-tag: \`${{ steps.v.outputs.tag }}\`"
            echo "- published: ${{ github.event_name == 'push' || inputs.dry_run == false }}"
          } >> "$GITHUB_STEP_SUMMARY"
